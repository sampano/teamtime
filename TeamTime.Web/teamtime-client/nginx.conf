server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # Block access to hidden files
    location ~ /\. {
        return 404;
    }

    # React Router fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Forward API requests to ASP.NET Core
    location /api/ {

        # Validate internal proxy authentication
        if ($http_x_teamtime_proxy_token != "${TEAMTIME_PROXY_TOKEN}") {
            return 403;
        }

        # Require HTTPS from Traefik
        if ($http_x_forwarded_proto != "https") {
            return 403;
        }

        proxy_pass http://10.0.10.20:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;

        # Never forward the internal authentication token
        proxy_set_header X-TeamTime-Proxy-Token "";

        proxy_cache off;
    }
}