services:
  teamtime-web:
    build:
      context: ./TeamTime.Web/teamtime-client
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "80"
    environment:
      TEAMTIME_PROXY_TOKEN: "${TEAMTIME_PROXY_TOKEN:?Required}"
      NGINX_ENVSUBST_FILTER: "^TEAMTIME_PROXY_TOKEN$"
    labels:
      - "traefik.docker.network=coolify"
      - "traefik.http.middlewares.teamtime-proxy-auth.headers.customrequestheaders.X-TeamTime-Proxy-Token=${TEAMTIME_PROXY_TOKEN:?Required}"
    networks:
      teamtime-private:
        ipv4_address: 10.0.10.10
      coolify:

  teamtime-api:
    build:
      context: ./TeamTime.Api/TeamTime.Api
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://10.0.10.20:8080
      ConnectionStrings__UserDatabase: "${TEAMTIME_DB_CONNECTION_STRING:?Required}"
      ReverseProxy__NginxProxy: "10.0.10.10"
    volumes:
      - teamtime-dataprotection:/app/keys
    networks:
      teamtime-private:
        ipv4_address: 10.0.10.20
      coolify:

networks:
  teamtime-private:
    external: true
    name: teamtime-private

  coolify:
    external: true
    name: coolify

volumes:
  teamtime-dataprotection:
    external: true
    name: x4py6ecqwgqvjxebttxaoqia-teamtime-dataprotection
